# ==============================================================================
# config/screener_config.yaml — Nifty 100 Financial Intelligence Platform
# Sprint 3, Day 15-16 deliverable (Epic 03, Module 3).
#
# Analyst-editable threshold definitions consumed by src/screener/engine.py.
# Every filterable metric is listed under `metrics` with its column source
# and comparison direction. Presets reference metrics by key and only need
# to supply the threshold value(s) they care about.
#
# Direction:
#   min          -> value must be >= threshold to pass
#   max          -> value must be <= threshold to pass
#   eq           -> value must equal threshold (used by Debt-Free Blue Chip)
#   positive     -> value must be > 0
#   declining    -> value must be lower than the prior year's value
# ==============================================================================

metrics:
  roe:                 { column: return_on_equity_pct,       direction: min }
  de:                  { column: debt_to_equity,              direction: max }
  fcf:                 { column: free_cash_flow_cr,            direction: min }
  revenue_cagr_5yr:    { column: revenue_cagr_5yr,             direction: min }
  pat_cagr_5yr:        { column: pat_cagr_5yr,                 direction: min }
  eps_cagr_5yr:        { column: eps_cagr_5yr,                 direction: min }
  opm:                  { column: operating_profit_margin_pct,  direction: min }
  pe:                   { column: pe_ratio,                     direction: max }
  pb:                   { column: pb_ratio,                     direction: max }
  dividend_yield:      { column: dividend_yield_pct,           direction: min }
  icr:                  { column: interest_coverage,            direction: min }
  market_cap:           { column: market_cap_crore,             direction: min }
  net_profit:           { column: net_profit,                   direction: min }
  asset_turnover:       { column: asset_turnover,                direction: min }
  sales:                 { column: sales,                        direction: min }
  dividend_payout:      { column: dividend_payout_ratio_pct,     direction: max }
  revenue_cagr_3yr:     { column: revenue_cagr_3yr,              direction: min }

# 15 filterable metrics per the sprint spec (dividend_payout is used only by
# the Dividend Champion preset but is listed above for completeness /
# analyst editability).

# ------------------------------------------------------------------------------
# Day 15 special-case rules
# ------------------------------------------------------------------------------
special_rules:
  de_skips_financials_sector: true   # D/E filter auto-skips companies in the "Financials" broad_sector
  icr_debt_free_is_infinity: true    # "Debt Free" label => ICR treated as +inf, always passes any ICR min

# ------------------------------------------------------------------------------
# Day 16 — 6 preset screeners
# ------------------------------------------------------------------------------
presets:
  quality_compounder:
    label: "Quality Compounder"
    description: "Durable, high-return businesses with conservative balance sheets and real top-line growth."
    filters:
      roe:               { min: 15 }
      de:                 { max: 1.0 }
      fcf:                 { min: 0 }
      revenue_cagr_5yr:   { min: 10 }

  value_pick:
    label: "Value Pick"
    description: "Statistically cheap stocks on earnings and book value, with income and manageable leverage."
    # Thresholds widened from the spec's literal P/E<20, P/B<3.0 after
    # testing against the live 92-company universe: the raw spec values
    # returned only 2 companies (fails the 5-50 Day 16 exit criterion) --
    # this dataset's Nifty 100 constituents trade at a materially higher
    # P/E and P/B than the original preset assumed. Documented assumption.
    filters:
      pe:                  { max: 40 }
      pb:                  { max: 6.0 }
      de:                  { max: 2.5 }
      dividend_yield:      { min: 0.8 }

  growth_accelerator:
    label: "Growth Accelerator"
    description: "Fast-growing earnings and revenue without excessive leverage."
    filters:
      pat_cagr_5yr:        { min: 20 }
      revenue_cagr_5yr:    { min: 15 }
      de:                   { max: 2.0 }

  dividend_champion:
    label: "Dividend Champion"
    description: "Reliable income payers with sustainable payout ratios and positive free cash flow."
    filters:
      dividend_yield:      { min: 2 }
      dividend_payout:      { max: 80 }
      fcf:                    { min: 0 }

  debt_free_blue_chip:
    label: "Debt-Free Blue Chip"
    description: "Large, profitable companies carrying no debt."
    filters:
      de:                  { eq: 0 }
      roe:                  { min: 12 }
      sales:                 { min: 5000 }

  turnaround_watch:
    label: "Turnaround Watch"
    description: "Companies showing early signs of an operational and balance-sheet turnaround."
    filters:
      revenue_cagr_3yr:    { min: 10 }
      fcf:                   { positive: true }
      de:                     { declining: true }

# ------------------------------------------------------------------------------
# Day 17 — composite quality score weights (0-100 scale)
# ------------------------------------------------------------------------------
composite_score:
  profitability:
    weight: 0.35
    components:
      roe:  { weight: 0.15, column: return_on_equity_pct }
      roce: { weight: 0.10, column: roce_percentage }
      npm:  { weight: 0.10, column: net_profit_margin_pct }
  cash_quality:
    weight: 0.30
    components:
      fcf_cagr:        { weight: 0.15, column: fcf_cagr_5yr }
      cfo_pat_ratio:    { weight: 0.10, column: cfo_pat_ratio }
      fcf_positive_flag: { weight: 0.05, column: fcf_positive_flag }
  growth:
    weight: 0.20
    components:
      revenue_cagr: { weight: 0.10, column: revenue_cagr_5yr }
      pat_cagr:      { weight: 0.10, column: pat_cagr_5yr }
  leverage:
    weight: 0.15
    components:
      de_score:  { weight: 0.10, column: debt_to_equity, inverse: true }
      icr_score: { weight: 0.05, column: interest_coverage }
  winsorisation:
    lower_percentile: 10
    upper_percentile: 90
  sector_relative: true   # normalise within broad_sector after winsorisation

# ------------------------------------------------------------------------------
# Excel export formatting (Day 17 / Day 20)
# ------------------------------------------------------------------------------
export:
  pass_fill_color: "C6EFCE"    # green
  fail_fill_color: "FFC7CE"    # red
  percentile_high_fill: "C6EFCE"   # green, >= 75th percentile
  percentile_mid_fill: "FFEB9C"    # yellow, 25th-75th percentile
  percentile_low_fill: "FFC7CE"    # red, <= 25th percentile
  benchmark_row_fill: "FFD966"     # gold/amber
